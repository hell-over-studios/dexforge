name: ✨ Feature request
description: Suggest a feature or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do? What's missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see? Sketch UX if UI-related.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This fits an existing milestone (docs/ROADMAP.md)
        - label: This is new functionality worth a discussion
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
